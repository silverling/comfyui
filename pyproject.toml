    "addict>=2.4.0",
    "aiohttp>=3.11.8",
    "alembic>=1.18.4",
    "av>=14.2.0",
    "bitsandbytes>=0.41.1",
    "blake3>=1.0.8",
    "blend-modes>=2.2.0",
    "blind-watermark>=0.4.4",
    "clip-interrogator>=0.6.0",
    "color-matcher>=0.6.0",
    "colour-science>=0.4.6",
    "comfy-3d-viewers==0.2.41",
    "comfy-aimdo==0.2.14",
    "comfy-env==0.2.61",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.4",
    "comfyui-frontend-package==1.42.15",
    "comfyui-manager==4.2.1",
    "comfyui-workflow-templates==0.9.63",
    "deepdiff>=9.0.0",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "fastapi>=0.136.1",
    "filelock>=3.29.0",
    "ftfy>=6.3.1",
    "gguf>=0.13.0",
    "glfw>=2.10.0",
    "google-genai>=1.5.0",
    "google-generativeai>=0.8.6",
    "huggingface-hub>=0.23.4",
    "hydra-core>=1.3.2",
    "imageio-ffmpeg>=0.6.0",
    "iopath>=0.1.10",
    "jetson-stats>=4.3.2 ; platform_machine == 'aarch64'",
    "kornia>=0.7.1",
    "lark>=1.3.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "mediapipe>=0.10.35",
    "mss>=10.2.0",
    "numpy>=1.25.0",
    "omegaconf>=2.3.0",
    "onnxruntime>=1.24.3",
    "open-clip-torch>=2.24.0",
    "openai>=2.33.0",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=4.13.0.92",
    "peft>=0.12.0",
    "piexif>=1.1.3",
    "pillow>=10.1.0",
    "protobuf>=5.29.6",
    "psd-tools>=1.16.0",
    "psutil>=7.2.2",
    "py-cpuinfo>=9.0.0",
    "pycocotools>=2.0.11",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pymatting>=1.1.15",
    "pynvml>=13.0.1 ; platform_machine != 'aarch64'",
    "pyopengl>=3.1.10",
    "pytorch-lightning>=2.5.5",
    "pyyaml>=6.0.3",
    "pyzbar>=0.1.9",
    "qrcode>=8.2",
    "regex>=2026.4.4",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "safetensors>=0.4.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "segment-anything>=1.0",
    "sentencepiece>=0.2.1",
    "simpleeval>=1.0.0",
    "spandrel>=0.4.2",
    "sqlalchemy>=2.0",
    "timm>=1.0.26",
    "tokenizers>=0.13.3",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchsde>=0.2.6",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
